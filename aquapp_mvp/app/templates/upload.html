{% extends "base.html" %}

{% block content %}
<section class="card">
  <h2>Téléverser une nouvelle photo</h2>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <label for="file">Choisissez un fichier JPG ou PNG (max 10 Mo)</label>
    <input type="file" name="file" id="file" accept="image/jpeg,image/png" required />
    <label for="comment">Commentaire ou question (optionnel)</label>
    <textarea
      name="comment"
      id="comment"
      rows="3"
      maxlength="1000"
      placeholder="Ajoutez du contexte pour l'analyse..."
    >{{ comment }}</textarea>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <button class="button" type="submit">Téléverser</button>
  </form>
</section>
{% endblock %}
