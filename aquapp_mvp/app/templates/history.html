{% extends "base.html" %}

{% block content %}
<section class="card">
  <h2>Photo history</h2>
  {% if photos %}
    <div class="history-grid">
      {% for photo in photos %}
        <div class="history-item">
          <a href="/photo/{{ photo.id }}">
            <img src="/uploads/{{ photo.filepath }}" alt="Photo {{ photo.filename }}" width="200" />
          </a>
          <p>{{ photo.created_at }}</p>
          <a href="/photo/{{ photo.id }}">View details</a>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p>No uploads yet.</p>
  {% endif %}
</section>
{% endblock %}
